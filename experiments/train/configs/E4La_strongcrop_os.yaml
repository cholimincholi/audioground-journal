# E4La_strongcrop_os: E4La_strongcrop with the AudioSet-Strong event instructions (not short AudioCaps crops) oversampled
# x3 decaying to x1 over training (same schedule as E6La_oversample)
_base_: ../../../code/audioground/configs/audioground_7b.yaml
data:
  train_jsonl: ${oc.env:AG_DATA_ROOT,${oc.env:AG_ROOT}/data}/variants/strongcrop_lead/train.jsonl
  val_jsonl: ${oc.env:AG_DATA_ROOT,${oc.env:AG_ROOT}/data}/variants/strongcrop_lead/val.jsonl
  short_oversample_factor: 3.0
  short_oversample_schedule: decay
  oversample_target: strongcrop
model:
  ate: learned
