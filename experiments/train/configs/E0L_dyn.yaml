# E0L_dyn: training-dynamics run of E0L_main (keeps a checkpoint every 500 steps)
# random 0.5-9.5 s leading filler crop -> no answer starts at 0.0, clip-boundary grid randomly offset per sample
_base_: ../../../code/audioground/configs/audioground_7b.yaml
data:
  train_jsonl: ${oc.env:AG_DATA_ROOT,${oc.env:AG_ROOT}/data}/variants/lead/train.jsonl
  val_jsonl: ${oc.env:AG_DATA_ROOT,${oc.env:AG_ROOT}/data}/variants/lead/val.jsonl
  max_val_samples: 1000
train:
  keep_ckpt_every: 500
